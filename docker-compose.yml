services:
  kindwords:
    build: .
    image: kindwords:local
    ports:
      - "${KINDWORDS_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - kindwords-data:/data
    restart: unless-stopped
    # Hardening: nothing but /data (and /tmp) is writable, no privilege escalation, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  kindwords-data:
